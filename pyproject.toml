[project]
name = "codebeamer-automation-suite"
description = "Excel 계층 데이터를 Codebeamer Tracker Item으로 변환하고 업로드하는 자동화 도구"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv", "build", "dist", "release-artifacts", "templates"]

[tool.ruff.lint]
# 현재 코드베이스가 위반 없이 통과하는 규칙만 게이트로 사용한다.
# 새 규칙을 추가할 때는 위반을 먼저 0으로 만든 뒤 여기에 등록한다.
select = [
    "E4",   # import 관련 pycodestyle
    "E7",   # 비교/구문 pycodestyle
    "E9",   # 구문 오류
    "W",    # 공백·개행 경고
    "F",    # pyflakes (미사용 import, 정의되지 않은 이름)
    "I",    # import 정렬
    "UP",   # 구버전 문법 현대화
    "B",    # bugbear (지연 바인딩, 가변 기본값 등)
    "C4",   # 불필요한 comprehension/생성자
    "SIM",  # 단순화 가능한 분기
    "RET",  # return 흐름
    "RUF",  # ruff 고유 규칙
]
# E501(줄 길이)은 아직 위반이 많아 게이트에 넣지 않는다. 위 line-length는 포매팅 기준으로만 쓴다.
ignore = [
    # 사용자 문구와 문서가 한글이라 전각 기호를 의도적으로 사용한다.
    "RUF001",
]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
known-first-party = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Qt 위젯 클래스는 시그널·컬럼 정의를 클래스 속성으로 두는 관례를 따른다.
"src/gui/*.py" = ["RUF012"]
# 테스트 fake 객체는 호출 기록을 클래스 속성으로 공유하는 경우가 있다.
"tests/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
exclude = '(^|/)(\.venv|build|dist)/'
ignore_missing_imports = true
follow_imports = "silent"
# 점진 도입 단계다. 아래 항목은 위반을 정리한 뒤 하나씩 켠다.
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# mypy 점진 도입: 아래 모듈은 아직 위반이 남아 있어 검사에서 제외한다.
# 기준 시점 위반 909건 / 50개 모듈. 모듈을 정리하면 이 목록에서 지운다.
